# aaPanel Nginx rewrite for CodeIgniter 3.
# Use one of the two blocks below, depending on how the domain points to the app.

# MODE A: domain document root points directly to the pustaka folder.
# Example root: /www/wwwroot/domain.com
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# MODE B: app is served as a subfolder, for example https://domain.com/pustaka.
# Enable this block only if the application is not the domain root.
# location /pustaka/ {
#     try_files $uri $uri/ /pustaka/index.php?$query_string;
# }

# Protect CodeIgniter internals, source dumps, private docs, and non-public storage.
location ~* ^/(application|system|storage|db_backup|Buku|docs|sql|scripts|deploy)/ {
    deny all;
    return 404;
}

# Protect hidden files such as .env, .git, .htaccess.
location ~ /\. {
    deny all;
    return 404;
}

